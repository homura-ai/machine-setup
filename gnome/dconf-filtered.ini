[org/gnome/desktop/applications/terminal]
exec='kitty'
exec-arg='--'

[org/gnome/desktop/input-sources]
show-all-sources=false
sources=[('xkb', 'us'), ('ibus', 'anthy'), ('ibus', 'libpinyin'), ('ibus', 'm17n:t:math-latex'), ('xkb', 'ru')]
xkb-options=['lv3:menu_switch', 'caps:escape', 'compose:ins', 'terminate:ctrl_alt_bksp']

[org/gnome/desktop/interface]
clock-show-seconds=true
clock-show-weekday=true
color-scheme='prefer-dark'
cursor-theme='Ina'
enable-animations=false
enable-hot-corners=false
font-antialiasing='grayscale'
font-hinting='slight'
gtk-enable-primary-paste=false
gtk-theme='Adwaita-dark'
icon-theme='Flat-Remix-Blue-Dark'
locate-pointer=false
toolkit-accessibility=false

[org/gnome/desktop/peripherals/keyboard]
numlock-state=true

[org/gnome/desktop/peripherals/mouse]
accel-profile='flat'
double-click=400
speed=0.0

[org/gnome/desktop/peripherals/touchpad]
two-finger-scrolling-enabled=true

[org/gnome/desktop/wm/keybindings]
activate-window-menu=@as []
maximize=['<Alt>space']
minimize=['<Super>space']
move-to-monitor-left=['<Alt>z']
move-to-monitor-right=['<Alt>x']
move-to-workspace-left=['<Super>a']
move-to-workspace-right=@as []
switch-applications=['<Super>Tab']
switch-applications-backward=['<Shift><Super>Tab']
switch-input-source=['<Super>c']
switch-input-source-backward=['<Shift><Super>c']
switch-to-workspace-left=['F9']
switch-windows=['<Alt>Tab']
switch-windows-backward=['<Shift><Alt>Tab']

[org/gnome/gedit/preferences/editor]
scheme='cobalt'
wrap-last-split-mode='word'

[org/gnome/mutter]
overlay-key='Super_L'

[org/gnome/nautilus/icon-view]
default-zoom-level='extra-large'

[org/gnome/nautilus/list-view]
default-zoom-level='large'

[org/gnome/nautilus/preferences]
default-folder-viewer='icon-view'
search-filter-time-type='last_modified'
search-view='list-view'

[org/gnome/settings-daemon/plugins/media-keys]
volume-mute=@as []
custom-keybindings=['/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom0/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom1/']

[org/gnome/shell]
disable-user-extensions=false
favorite-apps=['zen.desktop', 'vesktop.desktop', 'kitty.desktop', 'nvim.desktop', 'nemo.desktop', 'md.obsidian.Obsidian.desktop', 'im.riot.Riot.desktop', 't3code.desktop', 'librewolf.desktop', 'io.github.ungoogled_software.ungoogled_chromium.desktop', 'io.gitlab.librewolf-community.desktop', 'btop.desktop', 'org.gnome.Snapshot.desktop', 'com.github.wwmm.easyeffects.desktop', 'org.pulseaudio.pavucontrol.desktop', 'steam.desktop', 'audacity.desktop', 'com.heroicgameslauncher.hgl.desktop', 'org.signal.Signal.desktop', 'session-desktop-AM.desktop', 'com.obsproject.Studio.desktop', 'org.gnome.Software.desktop', 'org.gnome.tweaks.desktop', 'org.gnome.Extensions.desktop', 'org.gnome.Settings.desktop']
enabled-extensions=['just-perfection-desktop@just-perfection', 'user-theme@gnome-shell-extensions.gcampax.github.com', 'tiling-assistant@leleat-on-github', 'atomic-favorites@local.gnome', 'focused-window-dbus@flexagoon.com', 'audio-switch-shortcuts@dbatis.github.com', 'appindicatorsupport@rgcjonas.gmail.com']

[org/gnome/shell/extensions/audio-switch-shortcuts]
cycle-input-hotkey=['<Shift><Control><Alt>a']
cycle-output-hotkey=['<Shift><Control>a']

[org/gnome/shell/extensions/just-perfection]
animation=0
double-super-to-appgrid=true
panel=false
panel-in-overview=true
ripple-box=true
theme=false
workspace-wrap-around=true

[org/gnome/shell/extensions/tiling-assistant]
active-window-hint-color='rgb(236,1,1)'
focus-hint-color='rgb(236,1,1)'

[org/gnome/shell/extensions/user-theme]
name='Flat-Remix-Red-Darkest-fullPanel'

[org/gnome/shell/keybindings]
screenshot=['<Control>Print']
show-screenshot-ui=['Print']
toggle-application-view=@as []

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom0]
binding='<Shift>Pause'
command='systemctl suspend'
name='Suspend (sleep)'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom1]
binding='<Shift><Control><Alt><Super>Pause'
command='shutdown now'
name='shutdown now'
